server:
 port: 8088
spring:
 application:
  name: nurse-service
 datasource:
  url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/nurse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  username: ${DB_USER:root}
  password: ${DB_PASSWORD:root}
  driver-class-name: com.mysql.cj.jdbc.Driver
 jpa:
  hibernate:
   ddl-auto: validate
  properties:
   hibernate:
    dialect: org.hibernate.dialect.MySQL8Dialect
eureka:
 client:
  service-url:
   defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
jwt:
 secret: ${JWT_SECRET:medicore-super-secret-key-change-in-production-min-256-bits!!}
